<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartOverlay Overlay</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#cv{position:fixed}</style></head>
<body><div id="cv"></div>
<script>(function(){var q=location.search,m=q.match(/bg=([0-9a-fA-F]{6})/),c=m?"#"+m[1]:(q.indexOf("preview")>-1?"#1b2430":"");if(c)document.documentElement.style.background=document.body.style.background=c})()</script>
<script type="module">
import{listenData}from"./js/firebase.js";import{renderCanvas,tick}from"./js/canvas/render.js";
const cv=document.getElementById("cv"),RT={"16:9":16/9,"9:16":9/16};let v={},inf=null;
if(location.search.includes("info")){inf=document.createElement("div");inf.style.cssText="position:fixed;left:4px;top:4px;z-index:9;color:#0f0;background:#000a;font:12px monospace;padding:2px 4px";document.body.appendChild(inf)}
// ओवरले हमेशा ठीक 16:9 या 9:16 का फ्रेम बनाता है और उसे विंडो में फ़िट करता है
// कुछ स्टूडियो ऐप हमेशा 1920x1080 की विंडो खोलकर उसे 9:16 फ्रेम में खींच देते हैं। तब फ्रेम को पूरी विंडो पर रखकर अक्षरों को उलटा खींचते हैं।
let comp=false;
function fit(){const L=v.layout||{},r=RT[L.ratio]||16/9,W=innerWidth,H=innerHeight;let w=W,h=W/r;if(h>H){h=H;w=H*r}
comp=L.ratio=="9:16"&&W>H;if(comp){w=W;h=H;cv.dataset.cy=(9/16)*(H/W)}else delete cv.dataset.cy;
Object.assign(cv.style,{width:w+"px",height:h+"px",left:(W-w)/2+"px",top:(H-h)/2+"px"});
if(inf)inf.textContent="window "+W+"x"+H+" | frame "+Math.round(w)+"x"+Math.round(h)+" | "+(L.ratio||"16:9")+(comp?" | stretch-fix ON":"")}
const draw=()=>{fit();renderCanvas(cv,v.layout||{ratio:"16:9",layouts:{}},v.data||{})};
listenData("smartOverlay/canvas",x=>{v=x||{};draw()});
addEventListener("resize",draw);fit();
setInterval(()=>tick(cv,v.data||{}),250);
</script></body></html>
