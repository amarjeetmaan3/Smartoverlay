<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartOverlay Overlay</title>
<link rel="stylesheet" href="./css/integration/production/production-core.css">
<link rel="stylesheet" href="./css/integration/production/production-overlay.css">
<style>
#bootError{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:99;padding:12px;background:#2a1010;color:#fff;border:1px solid #ff4444;border-radius:10px;white-space:pre-wrap;word-break:break-word;font:13px/1.4 system-ui,sans-serif}
#bootStatus{display:none}
</style>
</head>
<body>
<main id="smartOverlayOverlay"></main>
<div id="bootStatus"></div>
<div id="bootError"></div>

<script>
// ब्राउज़र में जाँच के लिए: लिंक के अंत में ?preview लगाइए (OBS में मत लगाइए)।
// तब पीछे गहरा रंग दिखेगा, ताकि सफ़ेद टेक्स्ट दिखे। बिना ?preview के पृष्ठभूमि पारदर्शी रहती है।
if (location.search.indexOf("preview") !== -1) {
  document.documentElement.style.background = "#1b2430";
  document.body.style.background = "#1b2430";
}
window.addEventListener("error", function (e) {
  var b = document.getElementById("bootError");
  b.style.display = "block";
  b.textContent = "SMARTOVERLAY ERROR\n\n" + (e.message || "Unknown error");
});
window.addEventListener("unhandledrejection", function (e) {
  var b = document.getElementById("bootError");
  b.style.display = "block";
  b.textContent = "SMARTOVERLAY ERROR\n\n" + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
});
</script>

<script type="module">
import("./js/integration/production/production-bootstrap.js?t=" + Date.now());
</script>
</body>
</html>
