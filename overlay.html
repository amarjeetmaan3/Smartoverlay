<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartOverlay Overlay</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#cv{position:fixed;inset:0}</style></head>
<body><div id="cv"></div>
<script>(function(){var q=location.search,m=q.match(/bg=([0-9a-fA-F]{6})/),c=m?"#"+m[1]:(q.indexOf("preview")>-1?"#1b2430":"");if(c)document.documentElement.style.background=document.body.style.background=c})()</script>
<script type="module">
import{listenData}from"./js/firebase.js";import{renderCanvas,tick}from"./js/canvas/render.js";
const cv=document.getElementById("cv");let v={};
listenData("smartOverlay/canvas",x=>{v=x||{};renderCanvas(cv,v.layout||{ratio:"16:9",layouts:{}},v.data||{})});
setInterval(()=>tick(cv,v.data||{}),250);
</script></body></html>
