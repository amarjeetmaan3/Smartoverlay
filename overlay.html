<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SmartOverlay Live Output</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/overlay.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/overlay-editor.css">
  <link rel="stylesheet" href="css/pdf.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/score.css">
  <link rel="stylesheet" href="css/camera.css">

</head>


<body class="overlay-page">


  <main
    id="overlayRoot"
    class="overlay-root">

  </main>


  <div
    id="overlayStatus"
    class="overlay-status">

    SmartOverlay • LIVE

  </div>


  <script type="module">

    import {
      renderOverlay,
      clearOverlay
    } from "./js/overlay.js";

    import {
      listenData
    } from "./js/firebase.js";


    window.smartOverlayOutput = {

      render(data) {

        try {

          renderOverlay(
            data
          );

        } catch (error) {

          console.error(
            "Overlay render error:",
            error
          );

        }

      },


      clear() {

        try {

          clearOverlay();

        } catch (error) {

          console.error(
            "Overlay clear error:",
            error
          );

        }

      }

    };


    /*
     * Firebase live overlay listener
     *
     * Controller data will later be synced
     * through the Firebase Sync engine.
     */

    try {

      listenData(
        "smartOverlay/live",
        (data) => {

          if (!data) {

            window.smartOverlayOutput.clear();

            return;

          }


          window.smartOverlayOutput.render(
            data
          );

        }
      );

    } catch (error) {

      console.warn(
        "Firebase live listener not active yet:",
        error
      );

    }


    window.addEventListener(
      "smartoverlay:scene-change",
      (event) => {

        if (
          event.detail
        ) {

          window.smartOverlayOutput.render(
            event.detail
          );

        }

      }
    );


    window.addEventListener(
      "smartoverlay:overlay-clear",
      () => {

        window.smartOverlayOutput.clear();

      }
    );


    console.log(
      "SmartOverlay Overlay Loaded"
    );

  </script>


  <script
    type="module"
    src="js/overlay-core.js">
  </script>


</body>

</html>
