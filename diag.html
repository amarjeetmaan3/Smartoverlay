<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartOverlay Diag</title>
<style>
body{margin:0;padding:16px;background:#0b0f14;color:#f4f7fb;font:15px/1.5 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
pre{white-space:pre-wrap;word-break:break-word;background:#151b24;border:1px solid #2b3644;border-radius:10px;padding:12px}
.ok{color:#22c55e}.bad{color:#ef4444}
#app{margin-top:16px;border-top:1px dashed #2b3644;padding-top:12px}
</style></head><body>
<h1>SmartOverlay Diagnostic</h1>
<pre id="out">चल रहा है...</pre>
<main id="smartOverlayController"><section id="controllerApp"></section></main>
<div id="bootStatus" style="display:none"></div>
<div id="bootError" style="display:none;white-space:pre-wrap;color:#ff8080"></div>
<script type="module">
const out=document.getElementById("out"); const lines=[];
const log=(ok,msg)=>{lines.push((ok===null?"• ":ok?"✔ ":"✘ ")+msg); out.textContent=lines.join("\n");};
const base=location.href.replace(/[^/]*$/,"");
log(null,"पेज URL: "+location.href);
log(null,"फाइल नाम: "+(location.pathname.split("/").pop()));
async function grab(path){
  const r=await fetch(base+path+(path.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
  return {status:r.status,text:await r.text()};
}
try{
  const b=await grab("js/integration/production/production-bootstrap.js");
  log(b.status===200,"production-bootstrap.js  HTTP "+b.status);
  const fixed=b.text.includes('startsWith("overlay")');
  log(fixed,fixed?"bootstrap: नया (फिक्स वाला) कोड लाइव है":"bootstrap: पुराना कोड लाइव है — फिक्स अभी साइट पर नहीं पहुँचा");
}catch(e){log(false,"bootstrap fetch फेल: "+e)}
try{
  const c=await grab("controller.html");
  log(c.status===200,"controller.html  HTTP "+c.status);
  const nb=c.text.includes("build=3");
  log(nb,nb?"controller.html: नई (build 3) लाइव है":"controller.html: पुरानी लाइव है");
}catch(e){log(false,"controller.html fetch फेल: "+e)}
try{
  document.getElementById("bootError").style.display="none";
  await import("./js/integration/production/production-bootstrap.js?t="+Date.now());
  await new Promise(r=>setTimeout(r,800));
  const n=document.getElementById("controllerApp").children.length;
  log(n>0,n>0?"पैनल बन गया (नीचे दिखना चाहिए)":"पैनल नहीं बना");
  const be=document.getElementById("bootError");
  if(be.style.display==="block") log(false,"START ERROR:\n"+be.textContent);
}catch(e){log(false,"मॉड्यूल लोड एरर:\n"+(e&&e.stack?e.stack:e))}
</script>
</body></html>
