<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>SmartOverlay Controller</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #101114;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    #bootError {
      display: none;
      margin: 20px;
      padding: 20px;
      background: #2a1010;
      border: 1px solid #ff4444;
      border-radius: 12px;
      color: #ffffff;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    #bootStatus {
      padding: 20px;
      color: #aaa;
      font-size: 14px;
    }
  </style>

  <link rel="stylesheet" href="./css/integration/production/production-core.css">
  <link rel="stylesheet" href="./css/integration/production/production-controller.css">
</head>

<body>

  <main id="smartOverlayController">

    <div id="bootStatus">
      SmartOverlay loading...
    </div>

    <div id="bootError"></div>

    <header>
      <h1>SmartOverlay</h1>
    </header>

    <section id="controllerApp"></section>

  </main>

  <script>
    const bootError = document.getElementById("bootError");
    const bootStatus = document.getElementById("bootStatus");

    function showBootError(message) {
      bootStatus.style.display = "none";
      bootError.style.display = "block";
      bootError.textContent = "SMARTOVERLAY ERROR\n\n" + message;
    }

    window.addEventListener("error", function(event) {
      showBootError(
        event.message ||
        "Unknown JavaScript error"
      );
    });

    window.addEventListener("unhandledrejection", function(event) {
      const reason = event.reason;

      showBootError(
        reason && reason.stack
          ? reason.stack
          : String(reason || "Unhandled Promise rejection")
      );
    });
  </script>

  <script type="module">
    import("./js/integration/production/production-bootstrap.js")
      .then(() => {
        document.getElementById("bootStatus").textContent =
          "SmartOverlay loaded.";
      })
      .catch(error => {
        const message = error && error.stack
          ? error.stack
          : String(error);

        document.getElementById("bootStatus").style.display = "none";

        const box = document.getElementById("bootError");
        box.style.display = "block";
        box.textContent =
          "SMARTOVERLAY MODULE ERROR\n\n" + message;

        console.error(error);
      });
  </script>

</body>
</html>
