<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>SmartOverlay Controller</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/question.css">
  <link rel="stylesheet" href="css/media.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/overlay-editor.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/context-menu.css">
  <link rel="stylesheet" href="css/color-picker.css">
  <link rel="stylesheet" href="css/notification.css">
  <link rel="stylesheet" href="css/pdf.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/score.css">
  <link rel="stylesheet" href="css/camera.css">
  <link rel="stylesheet" href="css/form.css">

</head>

<body class="controller-page">

<div class="controller-app">


  <!-- TOP BAR -->

  <header class="controller-topbar">

    <div class="controller-brand">

      <a href="index.html"
         class="back-button"
         title="Dashboard">
        ←
      </a>

      <div class="brand-logo">
        SO
      </div>

      <div class="brand-info">
        <strong>SmartOverlay</strong>
        <span>Live Controller</span>
      </div>

    </div>


    <div class="controller-actions">

      <button
        id="undoBtn"
        class="icon-btn"
        title="Undo">
        ↶
      </button>

      <button
        id="redoBtn"
        class="icon-btn"
        title="Redo">
        ↷
      </button>

      <button
        id="saveBtn"
        class="btn btn-primary">
        Save
      </button>

      <a
        href="overlay.html"
        target="_blank"
        class="btn btn-secondary">
        Preview
      </a>

    </div>

  </header>



  <!-- MAIN WORKSPACE -->

  <main class="controller-workspace">


    <!-- LEFT TOOL PANEL -->

    <aside class="left-panel">

      <div class="panel-header">
        <strong>Tools</strong>
      </div>


      <div class="tool-list">

        <button
          class="tool-btn active"
          data-tool="select">
          <span>↖</span>
          <small>Select</small>
        </button>


        <button
          class="tool-btn"
          data-tool="text">
          <span>T</span>
          <small>Text</small>
        </button>


        <button
          class="tool-btn"
          data-tool="image">
          <span>▧</span>
          <small>Image</small>
        </button>


        <button
          class="tool-btn"
          data-tool="pdf">
          <span>PDF</span>
          <small>PDF</small>
        </button>


        <button
          class="tool-btn"
          data-tool="question">
          <span>?</span>
          <small>Question</small>
        </button>


        <button
          class="tool-btn"
          data-tool="timer">
          <span>◷</span>
          <small>Timer</small>
        </button>


        <button
          class="tool-btn"
          data-tool="score">
          <span>★</span>
          <small>Score</small>
        </button>


        <button
          class="tool-btn"
          data-tool="camera">
          <span>▣</span>
          <small>Camera</small>
        </button>

      </div>


      <div class="panel-divider"></div>


      <div class="media-upload">

        <div class="panel-header">
          <strong>Media</strong>
        </div>

        <input
          type="file"
          id="mediaFile"
          accept="image/*,video/*,audio/*,application/pdf"
          hidden
        >

        <button
          id="uploadMediaBtn"
          class="btn btn-secondary full-width">
          Upload Media
        </button>

        <div
          id="uploadStatus"
          class="upload-status">
          No file selected
        </div>

      </div>

    </aside>



    <!-- CENTER -->

    <section class="center-panel">


      <!-- CENTER HEADER -->

      <div class="canvas-header">

        <div class="canvas-title">

          <strong id="activeSceneTitle">
            Intro
          </strong>

          <span>
            1920 × 1080
          </span>

        </div>


        <div class="canvas-actions">

          <button
            id="zoomOutBtn"
            class="icon-btn">
            −
          </button>

          <span id="zoomValue">
            100%
          </span>

          <button
            id="zoomInBtn"
            class="icon-btn">
            +
          </button>

          <button
            id="fitCanvasBtn"
            class="icon-btn">
            Fit
          </button>

        </div>

      </div>



      <!-- CANVAS -->

      <div
        id="editorViewport"
        class="editor-viewport">

        <div
          id="editorCanvas"
          class="editor-canvas">

          <!-- Dynamic boxes appear here -->

        </div>

      </div>



      <!-- BOTTOM TOOLBAR -->

      <div class="editor-toolbar">

        <button
          id="addBoxBtn"
          class="toolbar-btn">
          ＋ Add Box
        </button>

        <button
          id="duplicateBtn"
          class="toolbar-btn">
          Duplicate
        </button>

        <button
          id="deleteBtn"
          class="toolbar-btn danger">
          Delete
        </button>

        <button
          id="clearBtn"
          class="toolbar-btn">
          Clear
        </button>

      </div>


    </section>



    <!-- RIGHT PANEL -->

    <aside class="right-panel">


      <div class="panel-header properties-header">

        <strong>Properties</strong>

        <button
          id="closeProperties"
          class="icon-btn">
          ×
        </button>

      </div>


      <div class="properties-body">


        <div class="property-section">

          <label>Element</label>

          <input
            id="propText"
            type="text"
            placeholder="Element text">

        </div>


        <div class="property-section">

          <label>Position</label>

          <div class="property-grid">

            <div>
              <span>X</span>
              <input
                id="propX"
                type="number"
                value="0">
            </div>

            <div>
              <span>Y</span>
              <input
                id="propY"
                type="number"
                value="0">
            </div>

          </div>

        </div>


        <div class="property-section">

          <label>Size</label>

          <div class="property-grid">

            <div>
              <span>Width</span>
              <input
                id="propWidth"
                type="number"
                value="300">
            </div>

            <div>
              <span>Height</span>
              <input
                id="propHeight"
                type="number"
                value="100">
            </div>

          </div>

        </div>


        <div class="property-section">

          <label>Transform</label>

          <div class="property-grid">

            <div>
              <span>Rotation</span>
              <input
                id="propRotation"
                type="number"
                value="0">
            </div>

            <div>
              <span>Opacity</span>
              <input
                id="propOpacity"
                type="number"
                min="0"
                max="100"
                value="100">
            </div>

          </div>

        </div>


        <div class="property-section">

          <label>Layer</label>

          <div class="layer-buttons">

            <button id="bringFrontBtn">
              Front
            </button>

            <button id="bringForwardBtn">
              Forward
            </button>

            <button id="sendBackwardBtn">
              Backward
            </button>

            <button id="sendBackBtn">
              Back
            </button>

          </div>

        </div>


        <div class="property-section">

          <label>State</label>

          <div class="state-buttons">

            <button id="hideBtn">
              Hide
            </button>

            <button id="lockBtn">
              Lock
            </button>

          </div>

        </div>


      </div>

    </aside>

  </main>



  <!-- SCENES -->

  <section class="scene-bar">

    <div class="scene-bar-header">

      <strong>Scenes</strong>

      <button
        id="newSceneBtn"
        class="btn btn-primary">
        + New Scene
      </button>

    </div>


    <div
      id="sceneList"
      class="scene-list">

      <button
        class="scene-item active"
        data-scene="Intro">
        Intro
      </button>

      <button
        class="scene-item"
        data-scene="Question">
        Question
      </button>

      <button
        class="scene-item"
        data-scene="Explanation">
        Explanation
      </button>

      <button
        class="scene-item"
        data-scene="Test">
        Test
      </button>

      <button
        class="scene-item"
        data-scene="Result">
        Result
      </button>

    </div>

  </section>


</div>



<!-- CORE -->

<script type="module" src="js/controller.js"></script>

<script type="module">

  import {
    uploadFile
  } from "./js/media-manager.js";


  const mediaInput =
    document.getElementById("mediaFile");

  const uploadButton =
    document.getElementById("uploadMediaBtn");

  const status =
    document.getElementById("uploadStatus");


  uploadButton.addEventListener(
    "click",
    () => {
      mediaInput.click();
    }
  );


  mediaInput.addEventListener(
    "change",
    async () => {

      const file =
        mediaInput.files[0];

      if (!file) {
        return;
      }


      status.textContent =
        "Uploading...";


      try {

        const result =
          await uploadFile(file);


        status.textContent =
          "Uploaded: " + result.name;


        window.dispatchEvent(
          new CustomEvent(
            "smartoverlay:file-uploaded",
            {
              detail: result
            }
          )
        );

      } catch (error) {

        console.error(error);

        status.textContent =
          "Upload failed";

      }

    }
  );

</script>


</body>
</html>
