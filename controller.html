<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>SmartOverlay Controller</title>

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Phase 1 CSS -->
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/question.css">
  <link rel="stylesheet" href="css/media.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/overlay-editor.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/context-menu.css">
  <link rel="stylesheet" href="css/color-picker.css">
  <link rel="stylesheet" href="css/notification.css">
  <link rel="stylesheet" href="css/pdf.css">
  <link rel="stylesheet" href="css/timer.css">
  <link rel="stylesheet" href="css/score.css">
  <link rel="stylesheet" href="css/camera.css">
  <link rel="stylesheet" href="css/form.css">

  <!-- Phase 2 CSS -->
  <link rel="stylesheet" href="css/editor-canvas.css">
  <link rel="stylesheet" href="css/box.css">
  <link rel="stylesheet" href="css/box-selection.css">
  <link rel="stylesheet" href="css/resize-handles.css">
  <link rel="stylesheet" href="css/transform.css">
  <link rel="stylesheet" href="css/layers.css">
  <link rel="stylesheet" href="css/alignment.css">
  <link rel="stylesheet" href="css/grid.css">
  <link rel="stylesheet" href="css/snapping.css">
  <link rel="stylesheet" href="css/guides.css">
  <link rel="stylesheet" href="css/multi-selection.css">
  <link rel="stylesheet" href="css/mobile-editor.css">

</head>

<body class="controller-page">

<div class="controller-app">

  <!-- TOP BAR -->
  <header class="controller-topbar">

    <div class="controller-brand">

      <a
        href="index.html"
        class="back-button"
        title="Dashboard"
      >
        ←
      </a>

      <div class="brand-logo">
        SO
      </div>

      <div class="brand-info">
        <strong>SmartOverlay</strong>
        <span>Live Controller</span>
      </div>

    </div>


    <div class="controller-actions">

      <button
        id="undoBtn"
        class="icon-btn"
        title="Undo"
      >
        ↶
      </button>

      <button
        id="redoBtn"
        class="icon-btn"
        title="Redo"
      >
        ↷
      </button>

      <button
        id="saveBtn"
        class="btn btn-primary"
      >
        Save
      </button>

      <a
        href="overlay.html"
        target="_blank"
        class="btn btn-secondary"
      >
        Preview
      </a>

    </div>

  </header>


  <!-- WORKSPACE -->
  <main class="controller-workspace">


    <!-- LEFT TOOLS -->
    <aside class="left-panel">

      <div class="panel-header">
        <strong>Tools</strong>
      </div>


      <div class="tool-list">

        <button
          class="tool-btn active"
          data-tool="select"
        >
          <span>↖</span>
          <small>Select</small>
        </button>


        <button
          class="tool-btn"
          data-tool="text"
        >
          <span>T</span>
          <small>Text</small>
        </button>


        <button
          class="tool-btn"
          data-tool="image"
        >
          <span>▧</span>
          <small>Image</small>
        </button>


        <button
          class="tool-btn"
          data-tool="pdf"
        >
          <span>PDF</span>
          <small>PDF</small>
        </button>


        <button
          class="tool-btn"
          data-tool="question"
        >
          <span>?</span>
          <small>Question</small>
        </button>


        <button
          class="tool-btn"
          data-tool="timer"
        >
          <span>◷</span>
          <small>Timer</small>
        </button>


        <button
          class="tool-btn"
          data-tool="score"
        >
          <span>★</span>
          <small>Score</small>
        </button>


        <button
          class="tool-btn"
          data-tool="camera"
        >
          <span>▣</span>
          <small>Camera</small>
        </button>

      </div>


      <div class="panel-divider"></div>


      <!-- EDITOR CONTROLS -->
      <div class="editor-side-controls">

        <div class="panel-header">
          <strong>Editor</strong>
        </div>


        <button
          id="toggleGridBtn"
          class="btn btn-secondary full-width"
        >
          Grid
        </button>


        <button
          id="centerBoxBtn"
          class="btn btn-secondary full-width"
        >
          Center
        </button>


        <button
          id="duplicateBoxBtn"
          class="btn btn-secondary full-width"
        >
          Duplicate
        </button>


        <button
          id="copyBoxBtn"
          class="btn btn-secondary full-width"
        >
          Copy
        </button>


        <button
          id="pasteBoxBtn"
          class="btn btn-secondary full-width"
        >
          Paste
        </button>

      </div>


      <div class="panel-divider"></div>


      <!-- MEDIA -->
      <div class="media-upload">

        <div class="panel-header">
          <strong>Media</strong>
        </div>


        <input
          type="file"
          id="mediaFile"
          accept="image/*,video/*,audio/*,application/pdf"
          hidden
        >


        <button
          id="uploadMediaBtn"
          class="btn btn-secondary full-width"
        >
          Upload Media
        </button>


        <div
          id="uploadStatus"
          class="upload-status"
        >
          No file selected
        </div>

      </div>

    </aside>



    <!-- CENTER EDITOR -->
    <section class="center-panel">


      <!-- CANVAS HEADER -->
      <div class="canvas-header">

        <div class="canvas-title">

          <strong id="activeSceneTitle">
            Intro
          </strong>

          <span id="canvasSizeLabel">
            1920 × 1080
          </span>

        </div>


        <div class="canvas-actions">

          <button
            id="zoomOutBtn"
            class="icon-btn"
          >
            −
          </button>

          <span id="zoomValue">
            100%
          </span>

          <button
            id="zoomInBtn"
            class="icon-btn"
          >
            +
          </button>

          <button
            id="fitCanvasBtn"
            class="icon-btn"
          >
            Fit
          </button>

        </div>

      </div>



      <!-- EDITOR VIEWPORT -->
      <div
        id="editorViewport"
        class="editor-viewport"
      >

        <div
          id="editorCanvas"
          class="editor-canvas"
        >

          <!-- Dynamic boxes -->

        </div>

      </div>



      <!-- EDITOR TOOLBAR -->
      <div class="editor-toolbar">

        <button
          id="addBoxBtn"
          class="toolbar-btn"
        >
          ＋ Add Box
        </button>


        <button
          id="duplicateBtn"
          class="toolbar-btn"
        >
          Duplicate
        </button>


        <button
          id="deleteBtn"
          class="toolbar-btn danger"
        >
          Delete
        </button>


        <button
          id="clearBtn"
          class="toolbar-btn"
        >
          Clear
        </button>


        <button
          id="gridBtn"
          class="toolbar-btn"
        >
          Grid
        </button>

      </div>

    </section>



    <!-- RIGHT PROPERTIES -->
    <aside class="right-panel">

      <div class="panel-header properties-header">

        <strong>Properties</strong>

        <button
          id="closeProperties"
          class="icon-btn"
        >
          ×
        </button>

      </div>


      <div class="properties-body">


        <!-- CONTENT -->
        <div class="property-section">

          <label>Element</label>

          <input
            id="propText"
            type="text"
            placeholder="Element text"
          >

        </div>



        <!-- POSITION -->
        <div class="property-section">

          <label>Position</label>

          <div class="property-grid">

            <div>
              <span>X</span>

              <input
                id="propX"
                type="number"
                value="0"
              >
            </div>


            <div>
              <span>Y</span>

              <input
                id="propY"
                type="number"
                value="0"
              >
            </div>

          </div>

        </div>



        <!-- SIZE -->
        <div class="property-section">

          <label>Size</label>

          <div class="property-grid">

            <div>
              <span>Width</span>

              <input
                id="propWidth"
                type="number"
                value="300"
              >
            </div>


            <div>
              <span>Height</span>

              <input
                id="propHeight"
                type="number"
                value="100"
              >
            </div>

          </div>

        </div>



        <!-- TRANSFORM -->
        <div class="property-section">

          <label>Transform</label>

          <div class="property-grid">

            <div>
              <span>Rotation</span>

              <input
                id="propRotation"
                type="number"
                value="0"
              >
            </div>


            <div>
              <span>Opacity</span>

              <input
                id="propOpacity"
                type="number"
                min="0"
                max="100"
                value="100"
              >
            </div>

          </div>

        </div>



        <!-- LAYER -->
        <div class="property-section">

          <label>Layer</label>

          <div class="layer-buttons">

            <button id="bringFrontBtn">
              Front
            </button>

            <button id="bringForwardBtn">
              Forward
            </button>

            <button id="sendBackwardBtn">
              Backward
            </button>

            <button id="sendBackBtn">
              Back
            </button>

          </div>

        </div>



        <!-- STATE -->
        <div class="property-section">

          <label>State</label>

          <div class="state-buttons">

            <button id="hideBtn">
              Hide
            </button>

            <button id="lockBtn">
              Lock
            </button>

          </div>

        </div>



        <!-- ALIGNMENT -->
        <div class="property-section">

          <label>Alignment</label>

          <div class="alignment-toolbar">

            <button id="alignLeftBtn">
              Left
            </button>

            <button id="alignCenterXBtn">
              Center
            </button>

            <button id="alignRightBtn">
              Right
            </button>

            <button id="alignTopBtn">
              Top
            </button>

            <button id="alignCenterYBtn">
              Middle
            </button>

            <button id="alignBottomBtn">
              Bottom
            </button>

          </div>

        </div>


      </div>

    </aside>

  </main>



  <!-- SCENE BAR -->
  <section class="scene-bar">

    <div class="scene-bar-header">

      <strong>Scenes</strong>

      <button
        id="newSceneBtn"
        class="btn btn-primary"
      >
        + New Scene
      </button>

    </div>


    <div
      id="sceneList"
      class="scene-list"
    >

      <button
        class="scene-item active"
        data-scene="Intro"
      >
        Intro
      </button>


      <button
        class="scene-item"
        data-scene="Question"
      >
        Question
      </button>


      <button
        class="scene-item"
        data-scene="Explanation"
      >
        Explanation
      </button>


      <button
        class="scene-item"
        data-scene="Test"
      >
        Test
      </button>


      <button
        class="scene-item"
        data-scene="Result"
      >
        Result
      </button>

    </div>

  </section>


</div>



<!-- MAIN CONTROLLER -->
<script type="module" src="js/controller.js"></script>


<!-- PHASE 2 EDITOR -->
<script type="module">

  import EditorCore
    from "./js/editor-core.js";

  import {
    snapBox
  } from "./js/snap-manager.js";

  import {
    align
  } from "./js/alignment-manager.js";


  const canvas =
    document.getElementById("editorCanvas");


  if (canvas) {

    window.smartOverlayEditor =
      new EditorCore(canvas);

  }


  /*
   * Add Box
   */

  const addBoxBtn =
    document.getElementById("addBoxBtn");


  addBoxBtn?.addEventListener(
    "click",
    () => {

      const editor =
        window.smartOverlayEditor;

      if (!editor) return;


      const box =
        editor.addBox({
          type: "text",
          content: "New Box",
          x: 100,
          y: 100,
          width: 300,
          height: 100
        });


      console.log(
        "Box created:",
        box
      );

    }
  );


  /*
   * Grid
   */

  const gridButtons = [
    document.getElementById("gridBtn"),
    document.getElementById("toggleGridBtn")
  ];


  gridButtons.forEach(
    button => {

      button?.addEventListener(
        "click",
        () => {

          window.smartOverlayEditor
            ?.grid
            .toggle();

        }
      );

    }
  );


  /*
   * Zoom
   */

  document
    .getElementById("zoomInBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        editor.canvasManager.zoomIn();

        const value =
          Math.round(
            editor.canvasManager.zoom * 100
          );

        document.getElementById(
          "zoomValue"
        ).textContent = value + "%";

      }
    );


  document
    .getElementById("zoomOutBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        editor.canvasManager.zoomOut();

        const value =
          Math.round(
            editor.canvasManager.zoom * 100
          );

        document.getElementById(
          "zoomValue"
        ).textContent = value + "%";

      }
    );


  /*
   * Fit Canvas
   */

  document
    .getElementById("fitCanvasBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        editor.canvasManager.fit(
          document.getElementById(
            "editorViewport"
          ).clientWidth,
          document.getElementById(
            "editorViewport"
          ).clientHeight
        );

      }
    );


  /*
   * Delete
   */

  document
    .getElementById("deleteBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        const ids =
          editor.selection.getAll();

        ids.forEach(
          id => editor.remove(id)
        );

        editor.selection.clear();

      }
    );


  /*
   * Clear
   */

  document
    .getElementById("clearBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        editor.boxSystem
          .all()
          .forEach(
            box =>
              editor.remove(box.id)
          );

        editor.selection.clear();

      }
    );


  /*
   * Duplicate
   */

  const duplicate =
    () => {

      const editor =
        window.smartOverlayEditor;

      if (!editor) return;

      const selected =
        editor.selection.getAll();

      selected.forEach(
        id => {

          const box =
            editor.boxSystem.get(id);

          if (!box) return;

          const copy =
            editor.addBox({
              ...box,
              id: undefined,
              x: box.x + 20,
              y: box.y + 20
            });

          editor.selection.select(
            copy.id
          );

        }
      );

    };


  document
    .getElementById("duplicateBtn")
    ?.addEventListener(
      "click",
      duplicate
    );


  document
    .getElementById("duplicateBoxBtn")
    ?.addEventListener(
      "click",
      duplicate
    );


  /*
   * Center
   */

  document
    .getElementById("centerBoxBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        const ids =
          editor.selection.getAll();

        const boxes =
          ids
            .map(
              id =>
                editor.boxSystem.get(id)
            )
            .filter(Boolean);

        align(
          boxes,
          "center-x"
        );

        align(
          boxes,
          "center-y"
        );

        boxes.forEach(
          box =>
            editor.renderer.render(box)
        );

      }
    );


  /*
   * Copy / Paste
   */

  document
    .getElementById("copyBoxBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        const boxes =
          editor.selection
            .getAll()
            .map(
              id =>
                editor.boxSystem.get(id)
            )
            .filter(Boolean);

        editor.clipboard.copy(boxes);

      }
    );


  document
    .getElementById("pasteBoxBtn")
    ?.addEventListener(
      "click",
      () => {

        const editor =
          window.smartOverlayEditor;

        if (!editor) return;

        const boxes =
          editor.clipboard.paste();

        boxes.forEach(
          box =>
            editor.addBox(box)
        );

      }
    );


  /*
   * Media Upload
   */

  import {
    uploadFile
  } from "./js/media-manager.js";


  const mediaInput =
    document.getElementById("mediaFile");

  const uploadButton =
    document.getElementById("uploadMediaBtn");

  const status =
    document.getElementById("uploadStatus");


  uploadButton?.addEventListener(
    "click",
    () => {

      mediaInput?.click();

    }
  );


  mediaInput?.addEventListener(
    "change",
    async () => {

      const file =
        mediaInput.files[0];

      if (!file) return;


      status.textContent =
        "Uploading...";


      try {

        const result =
          await uploadFile(file);


        status.textContent =
          "Uploaded: " + result.name;


        window.dispatchEvent(
          new CustomEvent(
            "smartoverlay:file-uploaded",
            {
              detail: result
            }
          )
        );


        console.log(
          "Media uploaded:",
          result
        );

      } catch (error) {

        console.error(error);

        status.textContent =
          "Upload failed";

      }

    }
  );


  console.log(
    "SmartOverlay Phase 2 Editor Loaded"
  );

</script>

</body>
</html>
