<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartOverlay Firebase Test</title>
<style>
body{margin:0;padding:16px;background:#0b0f14;color:#f4f7fb;font:15px/1.5 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
pre{white-space:pre-wrap;word-break:break-word;background:#151b24;border:1px solid #2b3644;border-radius:10px;padding:12px}
</style></head><body>
<h1>Firebase + Overlay Test</h1>
<pre id="out">चल रहा है...</pre>
<script type="module">
const out=document.getElementById("out"); const lines=[];
const log=(ok,msg)=>{lines.push((ok===null?"• ":ok?"✔ ":"✘ ")+msg); out.textContent=lines.join("\n");};
const base=location.href.replace(/[^/]*$/,"");
const timeout=(p,ms,label)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(label+" — "+ms/1000+" सेकंड में जवाब नहीं आया (कनेक्शन/databaseURL/नियम की दिक्कत)")),ms))]);

// 1) ओवरले की फाइल साइट पर नई है या नहीं
try{
  const r=await fetch(base+"js/integration/production/overlay-wiring.js?t="+Date.now(),{cache:"no-store"});
  const t=await r.text();
  const fixed=t.includes("raw.state");
  log(r.ok&&fixed,fixed?"overlay-wiring.js: नई (फिक्स वाली) लाइव है":"overlay-wiring.js: पुरानी लाइव है (HTTP "+r.status+") — नई फाइल साइट पर नहीं पहुँची");
}catch(e){log(false,"overlay-wiring fetch फेल: "+e)}

// 2) Firebase लिखना और वापस पढ़ना
try{
  const fb=await import("./js/firebase.js?t="+Date.now());
  log(null,"firebase.js लोड हो गई");
  const stamp="test-"+Date.now();
  await timeout(fb.setData("smartOverlay/live/state",{content:{type:"text",text:stamp},updatedAt:Date.now()}),8000,"Firebase में लिखना");
  log(true,"Firebase में लिखना सफल");
  const back=await timeout(fb.getData("smartOverlay/live/state"),8000,"Firebase से पढ़ना");
  const ok=back&&back.content&&back.content.text===stamp;
  log(ok,ok?"Firebase से वही डेटा वापस पढ़ लिया":"पढ़ा गया डेटा मेल नहीं खाता: "+JSON.stringify(back));
  log(null,"अब overlay.html खोलिए — उसमें यह टेक्स्ट दिखना चाहिए: "+stamp);
}catch(e){
  log(false,"Firebase एरर:\n"+(e&&e.code?e.code+" — ":"")+(e&&e.message?e.message:e));
}
</script>
</body></html>
